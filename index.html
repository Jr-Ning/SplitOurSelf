<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f4b5c">
<title>分帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2f3947;
    --hero: #3f4b5c;
    --ink-soft: #6b7686;
    --paper: #f4f4f6;
    --card: #ffffff;
    --line: #e1e3e8;
    --teal: #5f807a;
    --teal-soft: #e3ecea;
    --rose: #d3a5ab;
    --rose-soft: #efe0e2;
    --rose-hot: #f4c3cb;
    --danger: #a35c66;
    --radius: 14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px; line-height: 1.5; }
  body { padding: 0 0 calc(96px + var(--safe-b)); max-width: 520px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- 結算區 ---------- */
  .settle { background: var(--hero); color: #f4f4f6; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 22px;
    border-radius: 0 0 22px 22px; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .settle h1 { margin: 0; font-size: 17px; font-weight: 700; color: var(--rose-hot); letter-spacing: .04em; }
  .pill-btn { padding: 6px 14px; border-radius: 999px; border: 1px solid #70809a; background: transparent;
    color: #e6eaf0; font-size: 14px; }
  .transfer { font-size: 30px; font-weight: 700; line-height: 1.25; letter-spacing: .01em; }
  .transfer .even { color: #b7d4cd; }
  .bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin: 18px 0 8px; background: #566376; }
  .bar i { display: block; height: 100%; transition: width .35s; }
  .bar .a { background: var(--rose); }
  .bar .b { background: #a9c9c1; }
  .legend { display: flex; justify-content: space-between; font-size: 13px; color: #d3dae4; }
  .legend b { color: #fff; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .grid div { background: #4a576a; border-radius: 10px; padding: 10px 12px; }
  .grid span { display: block; font-size: 12px; color: #c0c8d4; }
  .grid strong { font-size: 17px; font-weight: 500; }
  .people { margin-top: 12px; font-size: 13px; color: #c0c8d4; }
  .people summary { cursor: pointer; padding: 4px 0; }
  .people table { width: 100%; margin-top: 6px; border-collapse: collapse; }
  .people td, .people th { padding: 5px 0; text-align: right; font-weight: 400; color: #e6eaf0; }
  .people td:first-child, .people th:first-child { text-align: left; }
  .people th { color: #c0c8d4; font-size: 12px; }
  .settle-btn { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px;
    background: var(--rose-soft); color: #4a3238; font-weight: 700; font-size: 16px; }
  .settle-btn:disabled { opacity: .4; }

  /* ---------- 明細 ---------- */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 20px 8px; }
  .list-head h2 { margin: 0; font-size: 17px; }
  .list-head span { font-size: 13px; color: var(--ink-soft); }
  .items { margin: 0; padding: 0 14px; list-style: none; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px; }
  .item-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .item-name { font-weight: 500; word-break: break-all; }
  .item-amt { font-weight: 700; white-space: nowrap; }
  .item-meta { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .item-actions { display: flex; gap: 8px; margin-top: 10px; }
  .item-actions button { flex: 1; padding: 8px; border-radius: 9px; border: 1px solid var(--line); background: #f9f9fb; font-size: 14px; }
  .item-actions .del { color: var(--danger); }
  .empty { text-align: center; color: var(--ink-soft); padding: 36px 20px; }

  /* ---------- 結算紀錄頁 ---------- */
  .h-head { background: var(--hero); color: #f4f4f6; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 20px;
    border-radius: 0 0 22px 22px; display: flex; justify-content: space-between; align-items: center; }
  .h-head h1 { margin: 0; font-size: 20px; font-weight: 700; }
  .filter { display: flex; align-items: center; gap: 10px; padding: 18px 20px 6px; font-size: 14px; color: var(--ink-soft); }
  .filter select { flex: 1; padding: 10px 12px; font: inherit; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: #fff; color: var(--ink); }
  .rec-list { padding: 8px 14px 0; }
  .rec { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .rec summary { list-style: none; cursor: pointer; padding: 14px; display: flex; justify-content: space-between;
    align-items: center; gap: 10px; }
  .rec summary::-webkit-details-marker { display: none; }
  .rec summary::before { content: "▶"; font-size: 11px; color: var(--ink-soft); margin-right: 8px; transition: transform .2s; }
  .rec[open] summary::before { transform: rotate(90deg); }
  .rec-date { font-weight: 500; flex: 1; }
  .rec-res { font-size: 14px; color: var(--teal); font-weight: 700; text-align: right; }
  .rec-body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .rec-meta { font-size: 13px; color: var(--ink-soft); margin: 12px 0 6px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th, .tbl td { padding: 6px 0; text-align: right; font-weight: 400; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl th { color: var(--ink-soft); font-size: 12px; border-bottom: 1px solid var(--line); }
  .rec-sub { font-size: 13px; color: var(--ink-soft); margin: 14px 0 6px; }
  .mini { padding: 8px 0; border-top: 1px dashed var(--line); }
  .mini:first-of-type { border-top: 0; }

  /* ---------- 新增按鈕 ---------- */
  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + var(--safe-b));
    background: var(--teal); color: #fff; border: 0; border-radius: 999px; padding: 14px 28px;
    font-weight: 700; font-size: 16px; box-shadow: 0 6px 18px rgba(95,128,122,.35); }

  /* ---------- 表單 ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(47,57,71,.45); display: none; z-index: 20; }
  .sheet-bg.open { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + var(--safe-b)); max-height: 92vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .25s ease; z-index: 21; }
  .sheet.open { transform: translateY(0); }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; }
  label.f { display: block; font-size: 13px; color: var(--ink-soft); margin: 14px 0 6px; }
  input[type=text], input[type=date], input[type=number] { width: 100%; padding: 12px; font: inherit; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 16px; }
  .chip.on { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 500; }
  .form-actions { display: flex; gap: 10px; margin-top: 22px; }
  .form-actions button { flex: 1; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-weight: 500; }
  .form-actions .save { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 700; }
  .preview { font-size: 13px; color: var(--ink-soft); margin-top: 10px; min-height: 20px; }

  /* ---------- 其他 ---------- */
  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -80px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 40;
    transition: transform .25s; max-width: 90%; text-align: center; }
  .toast.show { transform: translate(-50%, 0); }
  .toast.err { background: var(--danger); }
  .busy { position: fixed; inset: 0; background: rgba(244,244,246,.65); display: none; z-index: 30; align-items: center; justify-content: center; }
  .busy.on { display: flex; }
  .spinner { width: 34px; height: 34px; border: 4px solid var(--line); border-top-color: var(--teal); border-radius: 50%;
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sheet, .toast, .bar i, .rec summary::before { transition: none; } .spinner { animation-duration: 2s; } }
</style>
</head>
<body>

<!-- ================= 首頁 ================= -->
<div id="viewMain">
  <section class="settle" aria-live="polite">
    <div class="hero-top">
      <h1>目前待結算</h1>
      <button class="pill-btn" id="toHistory">結算紀錄</button>
    </div>
    <div class="transfer" id="transfer">載入中…</div>
    <div class="bar"><i class="a" id="barA" style="width:50%"></i><i class="b" id="barB" style="width:50%"></i></div>
    <div class="legend"><span>K 實付 <b id="lgA">0</b></span><span>T＋J 實付 <b id="lgB">0</b></span></div>
    <div class="grid">
      <div><span>目前總支出</span><strong id="total">0</strong></div>
      <div><span>明細筆數</span><strong id="count">0</strong></div>
    </div>
    <details class="people">
      <summary>查看每個人的實付與應分攤</summary>
      <table>
        <thead><tr><th></th><th>實付</th><th>應分攤</th></tr></thead>
        <tbody id="peopleRows"></tbody>
      </table>
    </details>
    <button class="settle-btn" id="settleBtn" disabled>結算</button>
  </section>

  <div class="list-head"><h2>目前明細</h2><span id="listNote"></span></div>
  <ul class="items" id="items"></ul>
</div>

<!-- ================= 結算紀錄頁 ================= -->
<div id="viewHistory" hidden>
  <header class="h-head">
    <h1>結算紀錄</h1>
    <button class="pill-btn" id="backBtn">回首頁</button>
  </header>
  <div class="filter"><label for="monthSel">結算月份</label><select id="monthSel"></select></div>
  <div class="rec-list" id="histList"></div>
</div>

<button class="fab" id="fab">新增支出</button>

<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle">
  <h3 id="formTitle">新增支出</h3>

  <label class="f" for="fName">項目</label>
  <input type="text" id="fName" placeholder="例如：晚餐、電費" autocomplete="off">

  <label class="f" for="fAmount">金額（NT$）</label>
  <input type="number" id="fAmount" inputmode="decimal" step="any" min="0" placeholder="0">

  <label class="f" for="fDate">日期</label>
  <input type="date" id="fDate">

  <label class="f">誰付的</label>
  <div class="chips" id="payerChips"></div>

  <label class="f">誰要分攤</label>
  <div class="chips" id="splitChips"></div>
  <div class="preview" id="preview"></div>

  <div class="form-actions">
    <button id="cancelBtn">取消</button>
    <button class="save" id="saveBtn">儲存</button>
  </div>
</div>

<div class="busy" id="busy"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ★★ 部署 Apps Script 後，把網頁應用程式網址貼在這裡 ★★ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxD5dDDLSaIxKcBkBTqz5vofw9Ewf0d0vDkYsu-Z7mUsTIZl6TxjI1F2_WTilAtTIC1Hg/exec';

const MEMBERS = ['K', 'T', 'J'];
const WK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
let state = { expenses: [], summary: null };
let histRecords = [];
let editingId = null;
let form = { payer: 'K', split: new Set(MEMBERS) };

const $ = id => document.getElementById(id);
const fmt = n => 'NT$ ' + Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
const num = n => Number(n).toLocaleString('zh-TW', { maximumFractionDigits: 2 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);

/* 日期工具：統一成 yyyy-MM-dd，並顯示成 YYYY/MM/DD Mon */
function isoDate(v) {
  v = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const d = new Date(v);
  if (isNaN(d)) return v;
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function fmtDay(v) {
  const iso = isoDate(v);
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return iso;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return m[1] + '/' + m[2] + '/' + m[3] + ' ' + WK[d.getDay()];
}
const splitText = s => s === 'ALL' ? '全部' : s.split(',').join('、');

/* ---------- API ---------- */
async function api(action, payload = {}) {
  $('busy').classList.add('on');
  try {
    // 用 text/plain 可避免瀏覽器的 CORS 預檢請求，Apps Script 才收得到
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, payload))
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    return j.data;
  } finally {
    $('busy').classList.remove('on');
  }
}

function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

async function run(action, payload, okMsg) {
  try {
    state = await api(action, payload);
    render();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    toast(e.message || '發生錯誤', true);
    return false;
  }
}

/* ---------- 明細卡片（首頁與紀錄頁共用） ---------- */
function itemHtml(ex, withActions) {
  return '<div class="item-top"><span class="item-name">' + esc(ex.name) + '</span><span class="item-amt">' + fmt(ex.amount) + '</span></div>' +
    '<div class="item-meta">' + esc(fmtDay(ex.date)) + '</div>' +
    '<div class="item-meta">付款人 ' + esc(ex.payer) + '｜分攤：' + esc(splitText(ex.split)) + '</div>' +
    (withActions
      ? '<div class="item-actions"><button data-edit="' + esc(ex.id) + '">編輯</button><button class="del" data-del="' + esc(ex.id) + '">刪除</button></div>'
      : '');
}

/* ---------- 首頁 ---------- */
function render() {
  const s = state.summary;
  const t = s.transfer;
  if (s.count === 0) {
    $('transfer').innerHTML = '<span class="even">目前沒有待結算的項目</span>';
  } else if (t.amount === 0) {
    $('transfer').innerHTML = '<span class="even">剛好打平</span>';
  } else {
    $('transfer').innerHTML = esc(t.from) + ' 轉給 ' + esc(t.to) + '<br>' + fmt(t.amount);
  }

  const a = s.groupA.paid, b = s.groupB.paid, sum = a + b;
  const pa = sum > 0 ? (a / sum) * 100 : 50;
  $('barA').style.width = pa + '%';
  $('barB').style.width = (100 - pa) + '%';
  $('lgA').textContent = num(a);
  $('lgB').textContent = num(b);
  $('total').textContent = fmt(s.total);
  $('count').textContent = s.count + ' 筆';
  $('settleBtn').disabled = s.count === 0;

  $('peopleRows').innerHTML = MEMBERS.map(m =>
    '<tr><td>' + m + '</td><td>' + num(s.paid[m] || 0) + '</td><td>' + num(s.owed[m] || 0) + '</td></tr>').join('');

  const list = state.expenses.slice().sort((x, y) =>
    isoDate(y.date).localeCompare(isoDate(x.date)) || y.createdAt - x.createdAt);
  $('listNote').textContent = list.length ? '共 ' + list.length + ' 筆' : '';
  $('items').innerHTML = list.length
    ? list.map(ex => '<li class="item">' + itemHtml(ex, true) + '</li>').join('')
    : '<li class="empty">還沒有支出，點下方「新增支出」開始記帳</li>';
}

/* ---------- 結算紀錄頁 ---------- */
function recResult(sm) {
  const t = sm.transfer;
  return t.amount === 0 ? '剛好打平' : t.from + ' 轉給 ' + t.to + ' ' + fmt(t.amount);
}

function renderHistory() {
  // 月份篩選
  const months = Array.from(new Set(histRecords.map(r => r.settledAt.slice(0, 7)))).sort().reverse();
  const cur = $('monthSel').value || 'all';
  $('monthSel').innerHTML = '<option value="all">全部</option>' +
    months.map(m => '<option value="' + m + '">' + m.replace('-', '/') + '</option>').join('');
  $('monthSel').value = (cur === 'all' || months.indexOf(cur) >= 0) ? cur : 'all';

  const sel = $('monthSel').value;
  const list = histRecords.filter(r => sel === 'all' || r.settledAt.slice(0, 7) === sel);

  $('histList').innerHTML = list.length ? list.map(r => {
    const sm = r.summary;
    const items = r.items.map(ex => '<div class="mini">' + itemHtml(ex, false) + '</div>').join('');
    return '<details class="rec">' +
      '<summary><span class="rec-date">' + esc(fmtDay(r.settledAt.slice(0, 10))) + '</span>' +
      '<span class="rec-res">' + esc(recResult(sm)) + '</span></summary>' +
      '<div class="rec-body">' +
        '<div class="rec-meta">結算時間 ' + esc(r.settledAt.slice(0, 16).replace(/-/g, '/')) + '｜共 ' + sm.count + ' 筆｜總支出 ' + fmt(sm.total) + '</div>' +
        '<table class="tbl"><thead><tr><th></th><th>實付</th><th>應分攤</th></tr></thead><tbody>' +
          MEMBERS.map(m => '<tr><td>' + m + '</td><td>' + num(sm.paid[m] || 0) + '</td><td>' + num(sm.owed[m] || 0) + '</td></tr>').join('') +
        '</tbody></table>' +
        '<div class="rec-sub">當次明細</div>' + items +
      '</div></details>';
  }).join('') : '<div class="empty">還沒有結算紀錄</div>';
}

async function loadHistory() {
  try {
    const d = await api('history');
    histRecords = d.records || [];
    renderHistory();
  } catch (e) {
    toast(e.message || '讀取失敗', true);
  }
}

/* ---------- 頁面切換（以網址 # 判斷，手機的返回鍵也能用） ---------- */
function route() {
  const h = location.hash === '#history';
  $('viewMain').hidden = h;
  $('viewHistory').hidden = !h;
  $('fab').hidden = h;
  window.scrollTo(0, 0);
  if (h) loadHistory(); else run('getData');
}
window.addEventListener('hashchange', route);
$('toHistory').onclick = () => { location.hash = 'history'; };
$('backBtn').onclick = () => { location.hash = ''; };
$('monthSel').onchange = renderHistory;

/* ---------- 表單 ---------- */
function renderChips() {
  $('payerChips').innerHTML = MEMBERS.map(m =>
    '<button type="button" class="chip' + (form.payer === m ? ' on' : '') + '" data-payer="' + m + '">' + m + '</button>').join('');
  const all = form.split.size === MEMBERS.length;
  $('splitChips').innerHTML =
    '<button type="button" class="chip' + (all ? ' on' : '') + '" data-split="ALL">ALL</button>' +
    MEMBERS.map(m => '<button type="button" class="chip' + (!all && form.split.has(m) ? ' on' : '') + '" data-split="' + m + '">' + m + '</button>').join('');
  updatePreview();
}

function updatePreview() {
  const amt = parseFloat($('fAmount').value);
  const n = form.split.size;
  $('preview').textContent = (amt > 0 && n > 0) ? '每人分攤 ' + fmt(Math.round(amt / n * 100) / 100) + '（' + n + ' 人）' : '';
}

function openForm(ex) {
  editingId = ex ? ex.id : null;
  $('formTitle').textContent = ex ? '編輯支出' : '新增支出';
  $('fName').value = ex ? ex.name : '';
  $('fAmount').value = ex ? ex.amount : '';
  $('fDate').value = ex ? isoDate(ex.date) : today();
  if (ex) {
    form.payer = MEMBERS.indexOf(ex.payer) >= 0 ? ex.payer : 'K';
    const names = ex.split === 'ALL' ? MEMBERS : ex.split.split(',').filter(x => MEMBERS.indexOf(x) >= 0);
    form.split = new Set(names.length ? names : MEMBERS);
  } else {
    const last = localStorage.getItem('lastPayer');
    form.payer = MEMBERS.indexOf(last) >= 0 ? last : 'K';
    form.split = new Set(MEMBERS);
  }
  renderChips();
  $('bg').classList.add('open');
  $('sheet').classList.add('open');
}

function closeForm() {
  $('bg').classList.remove('open');
  $('sheet').classList.remove('open');
}

async function save() {
  if (form.split.size === 0) return toast('請至少選一位分攤者', true);
  const expense = {
    id: editingId,
    name: $('fName').value.trim(),
    amount: parseFloat($('fAmount').value),
    date: $('fDate').value,
    payer: form.payer,
    split: form.split.size === MEMBERS.length ? 'ALL' : MEMBERS.filter(m => form.split.has(m)).join(',')
  };
  if (!expense.name) return toast('請輸入項目名稱', true);
  if (!(expense.amount > 0)) return toast('請輸入大於 0 的金額', true);
  if (!expense.date) return toast('請選擇日期', true);

  localStorage.setItem('lastPayer', form.payer);
  const ok = await run(editingId ? 'update' : 'add', { expense }, editingId ? '已更新' : '已新增');
  if (ok) closeForm();
}

/* ---------- 事件 ---------- */
$('fab').onclick = () => openForm(null);
$('cancelBtn').onclick = closeForm;
$('bg').onclick = closeForm;
$('saveBtn').onclick = save;
$('fAmount').oninput = updatePreview;

$('payerChips').onclick = e => {
  const m = e.target.dataset.payer;
  if (m) { form.payer = m; renderChips(); }
};

$('splitChips').onclick = e => {
  const v = e.target.dataset.split;
  if (!v) return;
  if (v === 'ALL') {
    form.split = new Set(MEMBERS);
  } else {
    const all = form.split.size === MEMBERS.length;
    if (all) form.split = new Set([v]);              // 從 ALL 點個別成員 → 只選該成員
    else if (form.split.has(v)) form.split.delete(v);
    else form.split.add(v);
  }
  renderChips();
};

$('items').onclick = e => {
  const editId = e.target.dataset.edit, delId = e.target.dataset.del;
  if (editId) openForm(state.expenses.find(x => x.id === editId));
  if (delId) {
    const ex = state.expenses.find(x => x.id === delId);
    if (confirm('確定刪除「' + ex.name + '」？')) run('delete', { id: delId }, '已刪除');
  }
};

$('settleBtn').onclick = () => {
  const t = state.summary.transfer;
  const msg = (t.amount === 0 ? '目前剛好打平。' : t.from + ' 轉給 ' + t.to + ' ' + fmt(t.amount) + '。') +
    '\n\n結算後重新計算，確定結算嗎？';
  if (confirm(msg)) run('settle', {}, '結算完成');
};

/* ---------- 啟動 ---------- */
route();
</script>
</body>
</html>
